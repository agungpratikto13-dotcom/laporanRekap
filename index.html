<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Harian</title>

<style>

* {
    box-sizing: border-box;
}


/* ================================
   BACKGROUND
================================ */

body {
    margin: 0;
    padding: 30px 15px;

    font-family: Arial, "Segoe UI", sans-serif;

    color: #e5e7eb;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(59, 130, 246, 0.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(139, 92, 246, 0.28),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(6, 182, 212, 0.20),
            transparent 35%
        ),
        #07111f;
}


/* ================================
   CONTAINER
================================ */

.container {
    max-width: 1050px;

    margin: auto;

    padding: 30px;

    background: rgba(15, 27, 45, 0.90);

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 24px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.50);

    backdrop-filter: blur(18px);
}


/* ================================
   JUDUL
================================ */

h1 {
    margin: 0 0 28px;

    text-align: center;

    font-size: 32px;

    font-weight: 800;

    letter-spacing: 1px;

    color: #ffffff;

    text-shadow:
        0 3px 15px rgba(59, 130, 246, 0.5);
}


/* ================================
   JUDUL SECTION
================================ */

h2 {
    margin-top: 30px;
    margin-bottom: 12px;

    padding: 14px 18px;

    color: white;

    font-size: 16px;

    font-weight: 700;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 8px 25px rgba(37, 99, 235, 0.25);
}


/* ================================
   TABLE
================================ */

table {
    width: 100%;

    border-collapse: separate;

    border-spacing: 0;

    overflow: hidden;

    border-radius: 14px;

    border:
        1px solid rgba(255, 255, 255, 0.10);

    background:
        rgba(15, 23, 42, 0.75);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.20);
}


/* ================================
   HEADER TABLE
================================ */

th {
    padding: 13px 12px;

    color: #dbeafe;

    background:
        rgba(30, 41, 59, 0.95);

    font-size: 12px;

    letter-spacing: 1px;

    text-transform: uppercase;
}


/* ================================
   CELL
================================ */

td {
    padding: 11px 12px;

    color: #e2e8f0;

    border-top:
        1px solid rgba(255, 255, 255, 0.07);

    background:
        rgba(15, 23, 42, 0.55);
}


/* ================================
   HOVER TABLE
================================ */

tbody tr {
    transition: 0.2s ease;
}

tbody tr:hover td {
    background:
        rgba(59, 130, 246, 0.12);
}


/* ================================
   INPUT
================================ */

td input {
    width: 100%;

    padding: 7px 8px;

    border: none;

    outline: none;

    border-radius: 6px;

    color: #ffffff;

    background:
        rgba(255, 255, 255, 0.04);

    font-size: 14px;
}


td input:focus {
    background:
        rgba(59, 130, 246, 0.15);

    box-shadow:
        0 0 0 1px
        rgba(96, 165, 250, 0.50);
}


/* ================================
   ANGKA
================================ */

.angka {
    text-align: right;

    font-weight: 600;

    font-variant-numeric:
        tabular-nums;
}


/* ================================
   TOTAL TRX
================================ */

.total-trx td {
    background:
        linear-gradient(
            90deg,
            rgba(16, 185, 129, 0.20),
            rgba(6, 182, 212, 0.15)
        );

    color: #86efac;

    font-weight: 800;
}


.total-trx input {
    color: #86efac;

    font-size: 17px;

    font-weight: 800;
}


/* ================================
   BUTTON
================================ */

.buttons {
    display: flex;

    gap: 12px;

    margin-top: 25px;
}


button {
    border: none;

    padding: 13px 20px;

    border-radius: 10px;

    cursor: pointer;

    color: white;

    font-size: 13px;

    font-weight: bold;

    transition:
        all 0.2s ease;
}


/* ================================
   COPY
================================ */

.copy {
    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    box-shadow:
        0 8px 25px
        rgba(16, 185, 129, 0.25);
}


.copy:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(16, 185, 129, 0.40);
}


/* ================================
   RESET
================================ */

.reset {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );

    box-shadow:
        0 8px 25px
        rgba(239, 68, 68, 0.25);
}


.reset:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(239, 68, 68, 0.40);
}


/* ================================
   SCROLLBAR
================================ */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #07111f;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            #2563eb,
            #7c3aed
        );

    border-radius: 10px;
}


/* ================================
   MOBILE
================================ */

@media(max-width: 700px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 15px;

        border-radius: 18px;
    }

    h1 {
        font-size: 25px;
    }

    h2 {
        font-size: 14px;
    }

    table {
        min-width: 650px;
    }

    .container {
        overflow-x: auto;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>LAPORAN HARIAN</h1>


<!-- =====================================================
     TABEL 1 : PGA
===================================================== -->

<h2>PGA</h2>

<table id="tabelPGA">

<thead>
<tr>
    <th>JENIS</th>
    <th>TANGGAL</th>
    <th>TOTAL</th>
    <th>TRX</th>
</tr>
</thead>

<tbody>

<tr>
    <td>DEPO PGA</td>

    <td>
        <input value="27 AGUSTUS 2026">
    </td>

    <td>
        <input class="angka"
               value="897304127"
               oninput="formatAngka(this)">
    </td>

    <td>
        <input class="angka"
               value="8661"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>WD PGA</td>

    <td>
        <input value="27 AGUSTUS 2026">
    </td>

    <td>
        <input class="angka"
               value="295900000"
               oninput="formatAngka(this)">
    </td>

    <td>
        <input class="angka"
               value="63"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>PENCAIRAN DANA PGA</td>

    <td>
        <input value="27 AGUSTUS 2026">
    </td>

    <td>
        <input class="angka"
               value="550000000"
               oninput="formatAngka(this)">
    </td>

    <td>
        <input class="angka"
               value="22"
               oninput="formatAngka(this)">
    </td>
</tr>

</tbody>
</table>


<!-- =====================================================
     TABEL 2 : QRIS
===================================================== -->

<h2>QRIS</h2>

<table id="tabelQRIS">

<thead>
<tr>
    <th>JENIS</th>
    <th>TANGGAL</th>
    <th>TOTAL</th>
    <th>TRX</th>
</tr>
</thead>

<tbody>

<tr>
    <td>DEPO QRIS PAYDIA (PRN)</td>

    <td>
        <input value="26 AGUSTUS 2026">
    </td>

    <td>
        <input class="angka"
               value="1412498440"
               oninput="formatAngka(this)">
    </td>

    <td>
        <input class="angka"
               value="25052"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>DEPO QRIS NETZME</td>

    <td>
        <input value="26 AGUSTUS 2026">
    </td>

    <td>
        <input class="angka"
               value="114271189"
               oninput="formatAngka(this)">
    </td>

    <td>
        <input class="angka"
               value="2084"
               oninput="formatAngka(this)">
    </td>
</tr>

</tbody>
</table>


<!-- =====================================================
     TABEL 3 : REKAP
===================================================== -->

<h2>REKAP</h2>

<table id="tabelRekap">

<tbody>

<tr>
    <td>MEMBER AKTIF</td>

    <td>
        <input class="angka"
               value="23842"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>TURNOVER</td>

    <td>
        <input class="angka"
               value="15003387115"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>REPORT DEPO</td>

    <td>
        <input class="angka"
               value="2621550933"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>REPORT WD</td>

    <td>
        <input class="angka"
               value="2104663396"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>REGIS</td>

    <td>
        <input class="angka"
               value="884"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>REG DEPO</td>

    <td>
        <input class="angka"
               value="683"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>TRX DEPO</td>

    <td>
        <input id="trxDepo"
               class="angka"
               value="39049"
               oninput="hitungTotalTrx()">
    </td>
</tr>


<tr>
    <td>TRX WD</td>

    <td>
        <input id="trxWd"
               class="angka"
               value="6596"
               oninput="hitungTotalTrx()">
    </td>
</tr>


<tr class="total-trx">
    <td>TOTAL TRX</td>

    <td>
        <input id="totalTrx"
               class="angka"
               value="45645"
               readonly>
    </td>
</tr>

</tbody>
</table>


<!-- =====================================================
     BONUS & CASHBACK
===================================================== -->

<h2>BONUS & CASHBACK</h2>

<table>

<tbody>

<tr>
    <td>BONUS HARIAN</td>

    <td>
        <input class="angka"
               value="1563400"
               oninput="formatAngka(this)">
    </td>
</tr>


<tr>
    <td>CASHBACK</td>

    <td>
        <input
            type="text"
            value="Cashback Live Game periode 17 AGUSTUS 2026 s/d 23 AGUSTUS 2026"
            placeholder="Tulis keterangan cashback..."
        >
    </td>
</tr>



<tr>
    <td>TOTAL CASHBACK</td>

    <td>
        <input class="angka"
               value="16543103"
               oninput="formatAngka(this)">
    </td>
</tr>

</tbody>

</table>


<!-- =====================================================
     TOMBOL
===================================================== -->

<div class="buttons">

<button class="copy" onclick="copyLaporan()">
    📋 COPY LAPORAN
</button>

<button class="reset" onclick="resetLaporan()">
    🔄 RESET
</button>

</div>

</div>


<script>

/* =====================================================
   MEMBERSIHKAN ANGKA
===================================================== */

function angkaBersih(value) {

    return value
        .replace(/,/g, '')
        .replace(/\D/g, '');

}


/* =====================================================
   FORMAT ANGKA DENGAN KOMA
===================================================== */

function formatAngka(input) {

    let value = angkaBersih(input.value);

    if (value === '') {

        input.value = '';

        return;

    }

    input.value =
        Number(value).toLocaleString('en-US');

}


/* =====================================================
   HITUNG TOTAL TRX
===================================================== */

function hitungTotalTrx() {

    let depo =
        angkaBersih(
            document.getElementById('trxDepo').value
        );

    let wd =
        angkaBersih(
            document.getElementById('trxWd').value
        );


    depo = Number(depo || 0);

    wd = Number(wd || 0);


    let total = depo + wd;


    document.getElementById('totalTrx').value =
        total.toLocaleString('en-US');

}


/* =====================================================
   COPY LAPORAN
===================================================== */

function copyLaporan() {

    let teks = '';


    /* =====================================================
       AMBIL TANGGAL REKAP DARI TANGGAL PGA
    ===================================================== */

    let tanggalRekap =
        document.querySelector('#tabelPGA tbody tr td:nth-child(2) input').value;


    /* =====================================================
       PGA
    ===================================================== */

    let pgaRows =
        document.querySelectorAll('#tabelPGA tbody tr');


    pgaRows.forEach((row, index) => {

        let cells = row.querySelectorAll('td');

        let jenis =
            cells[0].innerText.trim();

        let tanggal =
            cells[1].querySelector('input').value;

        let total =
            cells[2].querySelector('input').value;

        let trx =
            cells[3].querySelector('input').value;


        teks += jenis +
            ' TANGGAL ' +
            tanggal +
            '\n';


        /* Garis berbeda untuk setiap baris */

        if (index === 0) {

            teks +=
                '===============================\n';

        } else if (index === 1) {

            teks +=
                '==============================\n';

        } else {

            teks +=
                '==========================================\n';

        }


        teks +=
            'TOTAL     = ' +
            total +
            '\n';


        teks +=
            'TRX         = ' +
            trx +
            '\n\n\n';

    });


    /* =====================================================
       QRIS
    ===================================================== */

    let qrisRows =
        document.querySelectorAll('#tabelQRIS tbody tr');


    qrisRows.forEach(row => {

        let cells = row.querySelectorAll('td');

        let jenis =
            cells[0].innerText.trim();

        let tanggal =
            cells[1].querySelector('input').value;

        let total =
            cells[2].querySelector('input').value;

        let trx =
            cells[3].querySelector('input').value;


        teks +=
            jenis +
            ' TANGGAL ' +
            tanggal +
            '\n\n';


        teks +=
            'TOTAL : ' +
            total +
            '\n';


        teks +=
            'TRX : ' +
            trx +
            '\n\n\n';

    });


    /* =====================================================
       REKAP
    ===================================================== */

    teks +=
        'REKAP TANGGAL ' +
        tanggalRekap +
        '\n\n';


    let rekapRows =
        document.querySelectorAll(
            '#tabelRekap tbody tr'
        );


    rekapRows.forEach(row => {

        let cells =
            row.querySelectorAll('td');

        let nama =
            cells[0].innerText.trim();

        let input =
            cells[1].querySelector('input');


        if (input) {

            teks +=
                nama +
                ' : ' +
                input.value +
                '\n';

        }

    });


    /* =====================================================
       BONUS & CASHBACK
    ===================================================== */

    let bonusTable =
        document.querySelector(
            '.container > table:last-of-type'
        );


    let bonusRows =
        bonusTable.querySelectorAll('tbody tr');


    /* BONUS HARIAN */

    let bonusHarian =
        bonusRows[0]
        .querySelector('input')
        .value;


    teks +=
        '\nBONUS HARIAN : Rp ' +
        bonusHarian +
        '\n';


    /* CASHBACK */

    let cashbackKeterangan =
        bonusRows[1]
        .querySelector('input')
        .value;


    let totalCashback =
        bonusRows[2]
        .querySelector('input')
        .value;


    teks +=
        cashbackKeterangan +
        ' Rp ' +
        totalCashback;


    /* =====================================================
       COPY
    ===================================================== */

    navigator.clipboard.writeText(teks)

        .then(() => {

            alert(
                'Laporan berhasil di-copy!'
            );

        })

        .catch(() => {

            alert(
                'Tidak bisa copy otomatis. Silakan copy secara manual.'
            );

        });

}



/* =====================================================
   RESET
===================================================== */

function resetLaporan() {

    if (!confirm('Yakin ingin menghapus semua data angka?')) {
        return;
    }


    /* ==========================================
       HAPUS SEMUA ANGKA
    ========================================== */

    document.querySelectorAll('.angka').forEach(input => {

        /* TOTAL TRX juga dikosongkan */
        input.value = '';

    });


    /* ==========================================
       HAPUS TANGGAL
       Jika tanggal juga ingin dikosongkan
    ========================================== */

    /*
    document.querySelectorAll(
        '#tabelPGA td:nth-child(2) input, #tabelQRIS td:nth-child(2) input'
    ).forEach(input => {
        input.value = '';
    });
    */


    /* ==========================================
       KETERANGAN CASHBACK TETAP ADA
    ========================================== */


    alert('Semua data angka berhasil dihapus!');

}


/* =====================================================
   FORMAT ANGKA SAAT HALAMAN DIBUKA
===================================================== */

document
    .querySelectorAll('.angka')
    .forEach(input => {

        if (input.value) {

            let value =
                angkaBersih(input.value);


            if (value !== '') {

                input.value =
                    Number(value)
                    .toLocaleString('en-US');

            }

        }

    });


/* HITUNG TOTAL TRX SAAT PERTAMA DIBUKA */

hitungTotalTrx();

</script>

</body>
</html>
