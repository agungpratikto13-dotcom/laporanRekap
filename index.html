<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Harian</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        margin: 0;
        padding: 20px;
        color: #222;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 24px;
    }

    h2 {
        background: #222;
        color: white;
        padding: 10px;
        font-size: 17px;
        border-radius: 6px;
        margin-top: 25px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th {
        background: #e9ecef;
        font-weight: bold;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 10px;
    }

    td input {
        width: 100%;
        box-sizing: border-box;
        border: none;
        outline: none;
        font-size: 14px;
        background: transparent;
    }

    td input:focus {
        background: #fff8dc;
    }

    .angka {
        text-align: right;
    }

    .rekap-total {
        background: #b7e4c7;
        font-weight: bold;
        font-size: 16px;
    }

    .otomatis {
        background: #eef7ee;
        font-weight: bold;
        color: #198754;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .copy {
        background: #198754;
        color: white;
    }

    .reset {
        background: #dc3545;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    @media(max-width:600px) {
        body {
            padding: 8px;
        }

        .container {
            padding: 12px;
        }

        table {
            font-size: 12px;
        }

        th, td {
            padding: 6px;
        }
    }
</style>
</head>

<body>

<div class="container">

<h1>LAPORAN HARIAN</h1>

<h2>TRANSAKSI PGA & QRIS</h2>

<table id="transaksi">
    <thead>
        <tr>
            <th>JENIS</th>
            <th>TANGGAL</th>
            <th>TOTAL</th>
            <th>TRX</th>
        </tr>
    </thead>

    <tbody>

        <tr>
            <td>DEPO PGA</td>

            <td>
                <input value="27 AGUSTUS 2026">
            </td>

            <td>
                <input class="angka uang"
                       value="897304127"
                       oninput="formatInput(this); hitungRekap()">
            </td>

            <td>
                <input class="angka trx transaksi-trx depo-trx"
                       value="8661"
                       oninput="formatInput(this); hitungRekap()">
            </td>
        </tr>


        <tr>
            <td>WD PGA</td>

            <td>
                <input value="27 AGUSTUS 2026">
            </td>

            <td>
                <input class="angka uang"
                       value="295900000"
                       oninput="formatInput(this); hitungRekap()">
            </td>

            <td>
                <input class="angka trx transaksi-trx wd-trx"
                       value="63"
                       oninput="formatInput(this); hitungRekap()">
            </td>
        </tr>


        <tr>
            <td>PENCAIRAN DANA PGA</td>

            <td>
                <input value="27 AGUSTUS 2026">
            </td>

            <td>
                <input class="angka uang"
                       value="550000000"
                       oninput="formatInput(this)">
            </td>

            <td>
                <input class="angka trx"
                       value="22"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>DEPO QRIS PAYDIA (PRN)</td>

            <td>
                <input value="26 AGUSTUS 2026">
            </td>

            <td>
                <input class="angka uang"
                       value="1412498440"
                       oninput="formatInput(this)">
            </td>

            <td>
                <input class="angka trx"
                       value="25052"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>DEPO QRIS NETZME</td>

            <td>
                <input value="26 AGUSTUS 2026">
            </td>

            <td>
                <input class="angka uang"
                       value="114271189"
                       oninput="formatInput(this)">
            </td>

            <td>
                <input class="angka trx"
                       value="2084"
                       oninput="formatInput(this)">
            </td>
        </tr>

    </tbody>
</table>


<h2>REKAP</h2>

<table>

    <tbody>

        <tr>
            <td>MEMBER AKTIF</td>
            <td>
                <input class="angka"
                       value="23842"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>TURNOVER</td>
            <td>
                <input class="angka uang"
                       value="15003387115"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>REPORT DEPO</td>
            <td>
                <input class="angka uang"
                       value="2621550933"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>REPORT WD</td>
            <td>
                <input class="angka uang"
                       value="2104663396"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>REGIS</td>
            <td>
                <input class="angka"
                       value="884"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>REG DEPO</td>
            <td>
                <input class="angka"
                       value="683"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <!-- OTOMATIS DARI TABEL TRANSAKSI -->

        <tr class="otomatis">
            <td>TRX DEPO</td>
            <td>
                <input id="trxDepo"
                       class="angka"
                       value="0"
                       readonly>
            </td>
        </tr>


        <tr class="otomatis">
            <td>TRX WD</td>
            <td>
                <input id="trxWd"
                       class="angka"
                       value="0"
                       readonly>
            </td>
        </tr>


        <tr class="rekap-total">
            <td>TOTAL TRX</td>
            <td>
                <input id="totalTrx"
                       class="angka"
                       value="0"
                       readonly>
            </td>
        </tr>

    </tbody>
</table>


<h2>BONUS & CASHBACK</h2>

<table>

    <tbody>

        <tr>
            <td>BONUS HARIAN</td>

            <td>
                <input class="angka uang"
                       value="1563400"
                       oninput="formatInput(this)">
            </td>
        </tr>


        <tr>
            <td>CASHBACK LIVE GAME</td>

            <td>
                <input value="17 AGUSTUS 2026 s/d 23 AGUSTUS 2026">
            </td>
        </tr>


        <tr>
            <td>TOTAL CASHBACK</td>

            <td>
                <input class="angka uang"
                       value="16543103"
                       oninput="formatInput(this)">
            </td>
        </tr>

    </tbody>
</table>


<div class="buttons">

    <button class="copy" onclick="copyLaporan()">
        📋 COPY LAPORAN
    </button>

    <button class="reset" onclick="resetLaporan()">
        🔄 RESET
    </button>

</div>

</div>


<script>

/* =========================
   FORMAT ANGKA
========================= */

function angkaBersih(value) {

    return value
        .replace(/,/g, '')
        .replace(/\D/g, '');

}


function formatInput(input) {

    let value = angkaBersih(input.value);

    if (value === '') {

        input.value = '';

        return;

    }

    input.value = Number(value).toLocaleString('en-US');

}


/* =========================
   HITUNG REKAP TRX OTOMATIS
========================= */

function hitungRekap() {

    let depo = 0;

    let wd = 0;


    /* Ambil semua TRX yang termasuk DEPO */

    document.querySelectorAll('.depo-trx').forEach(input => {

        depo += Number(
            angkaBersih(input.value) || 0
        );

    });


    /* Ambil semua TRX yang termasuk WD */

    document.querySelectorAll('.wd-trx').forEach(input => {

        wd += Number(
            angkaBersih(input.value) || 0
        );

    });


    /* Tampilkan hasil */

    document.getElementById('trxDepo').value =
        depo.toLocaleString('en-US');


    document.getElementById('trxWd').value =
        wd.toLocaleString('en-US');


    /* TOTAL TRX */

    let total = depo + wd;


    document.getElementById('totalTrx').value =
        total.toLocaleString('en-US');

}


/* =========================
   COPY LAPORAN
========================= */

function copyLaporan() {

    let teks = '';

    teks += 'LAPORAN HARIAN\n';
    teks += '===============================\n\n';


    /* TRANSAKSI */

    let rows =
        document.querySelectorAll(
            '#transaksi tbody tr'
        );


    rows.forEach(row => {

        let kolom =
            row.querySelectorAll('td');


        let jenis =
            kolom[0].innerText.trim();


        let tanggal =
            kolom[1]
            .querySelector('input')
            .value;


        let total =
            kolom[2]
            .querySelector('input')
            .value;


        let trx =
            kolom[3]
            .querySelector('input')
            .value;


        teks +=
            jenis +
            ' TANGGAL ' +
            tanggal +
            '\n';


        teks +=
            'TOTAL     = ' +
            total +
            '\n';


        teks +=
            'TRX       = ' +
            trx +
            '\n\n';

    });


    /* REKAP */

    teks +=
        'REKAP TANGGAL ' +
        ambilTanggalRekap() +
        '\n';


    teks +=
        '===============================\n';


    let tabelRekap =
        document.querySelectorAll(
            '.container table'
        )[1];


    let rowsRekap =
        tabelRekap.querySelectorAll(
            'tbody tr'
        );


    rowsRekap.forEach(row => {

        let kolom =
            row.querySelectorAll('td');


        if (kolom.length < 2) return;


        let nama =
            kolom[0].innerText.trim();


        let input =
            kolom[1].querySelector('input');


        if (input) {

            teks +=
                nama +
                ' : ' +
                input.value +
                '\n';

        }

    });


    /* BONUS & CASHBACK */

    teks += '\n';


    teks +=
        'BONUS & CASHBACK\n';


    teks +=
        '===============================\n';


    let tabelBonus =
        document.querySelectorAll(
            '.container table'
        )[2];


    let rowsBonus =
        tabelBonus.querySelectorAll(
            'tbody tr'
        );


    rowsBonus.forEach(row => {

        let kolom =
            row.querySelectorAll('td');


        if (kolom.length < 2) return;


        let nama =
            kolom[0].innerText.trim();


        let input =
            kolom[1].querySelector('input');


        if (input) {

            teks +=
                nama +
                ' : ' +
                input.value +
                '\n';

        }

    });


    /* COPY */

    navigator.clipboard.writeText(teks)
        .then(() => {

            alert(
                'Laporan berhasil di-copy!'
            );

        })
        .catch(() => {

            alert(
                'Gagal melakukan copy. Silakan izinkan akses clipboard.'
            );

        });

}


/* =========================
   AMBIL TANGGAL REKAP
========================= */

function ambilTanggalRekap() {

    let input =
        document.querySelector(
            '#transaksi tbody tr td:nth-child(2) input'
        );


    if (input) {

        return input.value;

    }


    return '';

}


/* =========================
   RESET
========================= */

function resetLaporan() {

    if (
        confirm(
            'Yakin ingin mengembalikan data awal?'
        )
    ) {

        location.reload();

    }

}


/* =========================
   FORMAT AWAL
========================= */

document
    .querySelectorAll('.angka')
    .forEach(input => {

        if (input.value) {

            let value =
                angkaBersih(input.value);


            if (value !== '') {

                input.value =
                    Number(value)
                    .toLocaleString('en-US');

            }

        }

    });


/* Hitung pertama kali */

hitungRekap();

</script>

</body>
</html>
