<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Harian</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;

    font-family: Arial, "Segoe UI", sans-serif;

    color: #e5e7eb;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(59, 130, 246, 0.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(139, 92, 246, 0.28),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(6, 182, 212, 0.20),
            transparent 35%
        ),
        #07111f;
}


/* ================================
   CONTAINER
================================ */

.container {
    max-width: 1050px;

    margin: auto;

    padding: 30px;

    background: rgba(15, 27, 45, 0.90);

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 24px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.50);

    backdrop-filter: blur(18px);
}


/* ================================
   JUDUL
================================ */

h1 {
    margin: 0 0 28px;

    text-align: center;

    font-size: 32px;

    font-weight: 800;

    letter-spacing: 1px;

    color: #ffffff;

    text-shadow:
        0 3px 15px rgba(59, 130, 246, 0.5);
}


/* ================================
   JUDUL SECTION
================================ */

h2 {
    margin-top: 30px;

    margin-bottom: 12px;

    padding: 14px 18px;

    color: white;

    font-size: 16px;

    font-weight: 700;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 8px 25px rgba(37, 99, 235, 0.25);
}


/* ================================
   TABLE
================================ */

table {
    width: 100%;

    border-collapse: separate;

    border-spacing: 0;

    overflow: hidden;

    border-radius: 14px;

    border:
        1px solid rgba(255, 255, 255, 0.10);

    background:
        rgba(15, 23, 42, 0.75);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.20);
}


/* ================================
   HEADER TABLE
================================ */

th {
    padding: 13px 12px;

    color: #dbeafe;

    background:
        rgba(30, 41, 59, 0.95);

    font-size: 12px;

    letter-spacing: 1px;

    text-transform: uppercase;
}


/* ================================
   CELL
================================ */

td {
    padding: 11px 12px;

    color: #e2e8f0;

    border-top:
        1px solid rgba(255, 255, 255, 0.07);

    background:
        rgba(15, 23, 42, 0.55);
}


/* ================================
   HOVER TABLE
================================ */

tbody tr {
    transition: 0.2s ease;
}

tbody tr:hover td {
    background:
        rgba(59, 130, 246, 0.12);
}


/* ================================
   INPUT
================================ */

td input {
    width: 100%;

    padding: 7px 8px;

    border: none;

    outline: none;

    border-radius: 6px;

    color: #ffffff;

    background:
        rgba(255, 255, 255, 0.04);

    font-size: 14px;
}


td input:focus {
    background:
        rgba(59, 130, 246, 0.15);

    box-shadow:
        0 0 0 1px
        rgba(96, 165, 250, 0.50);
}


/* ================================
   ANGKA
================================ */

.angka {
    text-align: right;

    font-weight: 600;

    font-variant-numeric:
        tabular-nums;
}


/* ================================
   TOTAL TRX
================================ */

.total-trx td {
    background:
        linear-gradient(
            90deg,
            rgba(16, 185, 129, 0.20),
            rgba(6, 182, 212, 0.15)
        );

    color: #86efac;

    font-weight: 800;
}


.total-trx input {
    color: #86efac;

    font-size: 17px;

    font-weight: 800;
}


/* ================================
   BUTTON
================================ */

.buttons {
    display: flex;

    gap: 12px;

    margin-top: 25px;
}


button {
    border: none;

    padding: 13px 20px;

    border-radius: 10px;

    cursor: pointer;

    color: white;

    font-size: 13px;

    font-weight: bold;

    transition:
        all 0.2s ease;
}


/* ================================
   COPY
================================ */

.copy {
    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    box-shadow:
        0 8px 25px
        rgba(16, 185, 129, 0.25);
}


.copy:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(16, 185, 129, 0.40);
}


/* ================================
   RESET
================================ */

.reset {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );

    box-shadow:
        0 8px 25px
        rgba(239, 68, 68, 0.25);
}


.reset:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(239, 68, 68, 0.40);
}


/* ================================
   SCROLLBAR
================================ */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #07111f;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            #2563eb,
            #7c3aed
        );

    border-radius: 10px;
}


/* ================================
   MOBILE
================================ */

@media(max-width: 700px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 15px;

        border-radius: 18px;
    }

    h1 {
        font-size: 25px;
    }

    h2 {
        font-size: 14px;
    }

    table {
        min-width: 650px;
    }

    .container {
        overflow-x: auto;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>LAPORAN HARIAN</h1>

<tr>

    <td>

    </td>

    <td>
        <input

    <td>PENCAIRAN DANA PGA</td>

<h2>BONUS & CASHBACK</h2>

<tbody>

<tr>

    <td>BONUS HARIAN</td>

        <input
            class="angka"
            autocomplete="off"
            value=""
            oninput="formatAngka(this)">
    </td>

</tr>

    <td>CASHBACK</td>

    <td>
        <input
            type="text"
            autocomplete="off"
            value="Cashback Live Game periode 17 AGUSTUS 2026 s/d 23 AGUSTUS 2026"
            placeholder="Tulis keterangan cashback...">
    </td>

</tr>


<tr>

    <td>TOTAL CASHBACK</td>

            class="angka"

            value=""
            oninput="formatAngka(this)">

<!-- =====================================================
     BUTTON
===================================================== -->

<div class="buttons">

<button
    class="copy"
    type="button"
    onclick="copyLaporan()">

    📋 COPY LAPORAN

</button>


<button
    class="reset"
    type="button"
    onclick="resetLaporan()">

    🔄 RESET

</button>

</div>

</div>


<script>

/* =====================================================
   NAMA BULAN INDONESIA
===================================================== */

const namaBulan = [
    'JANUARI',
    'FEBRUARI',
    'MARET',
    'APRIL',
    'MEI',
    'JUNI',
    'JULI',
    'AGUSTUS',
    'SEPTEMBER',
    'OKTOBER',
    'NOVEMBER',
    'DESEMBER'
];


/* =====================================================
   FORMAT TANGGAL HARI INI
   CONTOH:
   29 AGUSTUS 2026
===================================================== */

function tanggalHariIni() {

    const sekarang = new Date();

    const tanggal =
        sekarang.getDate();

    const bulan =
        namaBulan[sekarang.getMonth()];

    const tahun =
        sekarang.getFullYear();

    return tanggal +
        ' ' +
        bulan +
        ' ' +
        tahun;
}


/* =====================================================
   SET SEMUA TANGGAL OTOMATIS
===================================================== */

function updateTanggalOtomatis() {

    const tanggal =
        tanggalHariIni();

    document
        .querySelectorAll('.tanggal')
        .forEach(input => {

            input.value = tanggal;

        });

}


/* =====================================================
   MEMBERSIHKAN ANGKA
===================================================== */

function angkaBersih(value) {

    return value
        .replace(/,/g, '')
        .replace(/\D/g, '');

}


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatAngka(input) {

    let value =
        angkaBersih(input.value);

    if (value === '') {

        input.value = '';

        return;

    }

    input.value =
        Number(value)
        .toLocaleString('en-US');

}


/* =====================================================
   HITUNG TOTAL TRX
===================================================== */

function hitungTotalTrx() {

    let depo =
        angkaBersih(
            document
                .getElementById('trxDepo')
                .value
        );


    let wd =
        angkaBersih(
            document
                .getElementById('trxWd')
                .value
        );


    depo =
        Number(depo || 0);

    wd =
        Number(wd || 0);


    let total =
        depo + wd;


    document
        .getElementById('totalTrx')
        .value =
            total === 0
                ? ''
                : total.toLocaleString('en-US');

}


/* =====================================================
   COPY LAPORAN
===================================================== */

function copyLaporan() {

    let teks = '';


    /* ==========================================
       TANGGAL REKAP
    ========================================== */

    let tanggalRekap =
        document
            .querySelector(
                '#tabelPGA tbody tr:first-child .tanggal'
            )
            .value;


    /* ==========================================
       PGA
    ========================================== */

    let pgaRows =
        document.querySelectorAll(
            '#tabelPGA tbody tr'
        );


    pgaRows.forEach((row, index) => {

        let cells =
            row.querySelectorAll('td');


        let jenis =
            cells[0]
                .innerText
                .trim();


        let tanggal =
            cells[1]
                .querySelector('input')
                .value;


        let total =
            cells[2]
                .querySelector('input')
                .value;


        let trx =
            cells[3]
                .querySelector('input')
                .value;


        teks +=
            jenis +
            ' TANGGAL ' +
            tanggal +
            '\n';


        if (index === 0) {

            teks +=
                '===============================\n';

        }

        else if (index === 1) {

            teks +=
                '==============================\n';

        }

        else {

            teks +=
                '==========================================\n';

        }


        teks +=
            'TOTAL     = ' +
            total +
            '\n';


        teks +=
            'TRX         = ' +
            trx +
            '\n\n\n';

    });


    /* ==========================================
       QRIS
    ========================================== */

    let qrisRows =
        document.querySelectorAll(
            '#tabelQRIS tbody tr'
        );


    qrisRows.forEach(row => {

        let cells =
            row.querySelectorAll('td');


        let jenis =
            cells[0]
                .innerText
                .trim();


        let tanggal =
            cells[1]
                .querySelector('input')
                .value;


        let total =
            cells[2]
                .querySelector('input')
                .value;


        let trx =
            cells[3]
                .querySelector('input')
                .value;


        teks +=
            jenis +
            ' TANGGAL ' +
            tanggal +
            '\n\n';


        teks +=
            'TOTAL : ' +
            total +
            '\n';


        teks +=
            'TRX : ' +
            trx +
            '\n\n\n';

    });


    /* ==========================================
       REKAP
    ========================================== */

    teks +=
        'REKAP TANGGAL ' +
        tanggalRekap +
        '\n\n';


    let rekapRows =
        document.querySelectorAll(
            '#tabelRekap tbody tr'
        );


    rekapRows.forEach(row => {

        let cells =
            row.querySelectorAll('td');


        let nama =
            cells[0]
                .innerText
                .trim();


        let input =
            cells[1]
                .querySelector('input');


        if (input) {

            teks +=
                nama +
                ' : ' +
                input.value +
                '\n';

        }

    });


    /* ==========================================
       BONUS & CASHBACK
    ========================================== */

    let bonusRows =
        document.querySelectorAll(
            '#tabelBonus tbody tr'
        );


    let bonusHarian =
        bonusRows[0]
            .querySelector('input')
            .value;


    teks +=
        '\nBONUS HARIAN : Rp ' +
        bonusHarian +
        '\n';


    let cashbackKeterangan =
        bonusRows[1]
            .querySelector('input')
            .value;


    let totalCashback =
        bonusRows[2]
            .querySelector('input')
            .value;


    teks +=
        cashbackKeterangan +
        ' Rp ' +
        totalCashback;


    /* ==========================================
       COPY
    ========================================== */

    navigator.clipboard
        .writeText(teks)

        .then(() => {

            alert(
                'Laporan berhasil di-copy!'
            );

        })

        .catch(() => {

            alert(
                'Tidak bisa copy otomatis. Silakan copy secara manual.'
            );

        });

}


/* =====================================================
   RESET
===================================================== */

function resetLaporan() {

    if (
        !confirm(
            'Yakin ingin menghapus semua data angka?'
        )
    ) {

        return;

    }


    /* ==========================================
       HAPUS SEMUA ANGKA
    ========================================== */

    document
        .querySelectorAll('.angka')
        .forEach(input => {

            input.value = '';

        });


    /* ==========================================
       TANGGAL TETAP OTOMATIS
    ========================================== */

    updateTanggalOtomatis();


    /* ==========================================
       KETERANGAN CASHBACK TIDAK DIHAPUS
    ========================================== */


    alert(
        'Semua data angka berhasil dihapus!'
    );

}


/* =====================================================
   MATIKAN AUTOFILL
===================================================== */

function matikanAutofill() {

    document
        .querySelectorAll('input')
        .forEach(input => {

            input.setAttribute(
                'autocomplete',
                'off'
            );

            input.setAttribute(
                'autocorrect',
                'off'
            );

            input.setAttribute(
                'autocapitalize',
                'off'
            );

            input.setAttribute(
                'spellcheck',
                'false'
            );

        });

}


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function() {

        /*
         * Tanggal otomatis mengikuti
         * tanggal hari ini.
         */
        updateTanggalOtomatis();


        /*
         * Semua input angka dikosongkan
         * saat halaman dibuka.
         */
        document
            .querySelectorAll('.angka')
            .forEach(input => {

                input.value = '';

            });


        /*
         * Cegah autofill browser.
         */
        matikanAutofill();

    }
);


/* =====================================================
   SAAT REFRESH / KEMBALI KE HALAMAN
===================================================== */

window.addEventListener(
    'pageshow',
    function() {

        /*
         * Pastikan tanggal selalu
         * mengikuti tanggal sekarang.
         */
        updateTanggalOtomatis();


        /*
         * Kosongkan semua angka.
         */
        document
            .querySelectorAll('.angka')
            .forEach(input => {

                input.value = '';

            });


        /*
         * Pastikan TOTAL TRX kosong.
         */
        document
            .getElementById('totalTrx')
            .value = '';


        /*
         * Matikan autofill lagi.
         */
        matikanAutofill();

    }
);

</script>
